<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Resume Builder — Create a Professional CV Online | Dinal Studios</title>
<meta name="description" content="Free online resume builder. Fill the form, watch your CV update live, print or save as PDF. Professional template, no sign-up, no watermark.">
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { margin: 0; background: #f2f4f8; color: #1c2333; }
  header { background: #8a3324; color: #fff; padding: 22px 16px; text-align: center; }
  header h1 { margin: 0 0 6px; font-size: 26px; }
  header p { margin: 0; opacity: .9; font-size: 14px; }
  .wrap { max-width: 1100px; margin: 24px auto; padding: 0 14px 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 820px){ .wrap { grid-template-columns: 1fr; } }
  .card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.07); }
  label { display: block; font-size: 12px; font-weight: 600; color: #5a6477; margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .4px; }
  input, textarea { width: 100%; padding: 9px 10px; border: 1px solid #ccd3e0; border-radius: 8px; font-size: 14px; }
  textarea { min-height: 74px; resize: vertical; }
  .btn { background: #8a3324; color: #fff; border: none; padding: 11px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; margin-top: 16px; }
  .btn:hover { background: #a8432f; }
  /* Resume preview */
  .resume { padding: 8px 6px; }
  .resume h2 { margin: 0; font-size: 26px; color: #8a3324; }
  .resume .title { font-size: 15px; color: #444; margin: 2px 0 6px; font-weight: 600; }
  .resume .contact { font-size: 12.5px; color: #666; border-bottom: 2px solid #8a3324; padding-bottom: 10px; }
  .resume h3 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #8a3324; margin: 18px 0 6px; border-bottom: 1px solid #e5ddd8; padding-bottom: 4px; }
  .resume p, .resume li { font-size: 13.5px; line-height: 1.55; }
  .resume ul { margin: 4px 0; padding-left: 18px; }
  .skills span { display: inline-block; background: #f3e9e5; border-radius: 20px; padding: 3px 11px; font-size: 12.5px; margin: 0 5px 6px 0; }
  footer { text-align: center; color: #8a93a6; font-size: 12px; padding: 6px 18px 22px; grid-column: 1 / -1; }
  @media print {
    header, .editor, footer { display: none !important; }
    body { background: #fff; }
    .wrap { display: block; margin: 0; padding: 0; }
    .card { box-shadow: none; border-radius: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>Resume Builder</h1>
  <p>Fill the form — your professional CV builds itself live. Print or save as PDF, free.</p>
</header>
<div class="wrap">
  <div class="card editor">
    <label>Full Name</label><input id="f-name" value="Your Name" oninput="render()">
    <label>Job Title</label><input id="f-title" value="Video Editor & Designer" oninput="render()">
    <label>Email</label><input id="f-email" placeholder="you@example.com" oninput="render()">
    <label>Phone</label><input id="f-phone" placeholder="+92 300 0000000" oninput="render()">
    <label>Location</label><input id="f-loc" placeholder="City, Country" oninput="render()">
    <label>Professional Summary</label><textarea id="f-summary" oninput="render()">Creative video editor and designer with experience in YouTube content, branding and social media marketing. Fast delivery, detail-focused, client-first.</textarea>
    <label>Skills (comma separated)</label><input id="f-skills" value="Video Editing, Logo Design, Thumbnails, Social Media, SEO" oninput="render()">
    <label>Experience (one job per line: Role — Company — Years — What you did)</label>
    <textarea id="f-exp" oninput="render()">Video Editor — Dinal Studios — 2024–Present — Edited 200+ YouTube videos and Shorts for international clients
Graphic Designer — Freelance — 2023–2024 — Logos, thumbnails and brand kits for small businesses</textarea>
    <label>Education (one entry per line)</label>
    <textarea id="f-edu" oninput="render()">Bachelor's Degree — Your University — 2023</textarea>
    <button class="btn" onclick="window.print()">Print / Save as PDF</button>
  </div>

  <div class="card">
    <div class="resume">
      <h2 id="r-name">Your Name</h2>
      <div class="title" id="r-title"></div>
      <div class="contact" id="r-contact"></div>
      <h3>Summary</h3><p id="r-summary"></p>
      <h3>Skills</h3><div class="skills" id="r-skills"></div>
      <h3>Experience</h3><ul id="r-exp"></ul>
      <h3>Education</h3><ul id="r-edu"></ul>
    </div>
  </div>
  <footer>Built by Dinal Studios — free resume builder, CV maker online, professional resume template</footer>
</div>
<script>
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/</g,'&lt;');
  function lines(id){ return $(id).value.split('\n').map(s => s.trim()).filter(Boolean); }
  function render(){
    $('r-name').textContent = $('f-name').value || 'Your Name';
    $('r-title').textContent = $('f-title').value;
    $('r-contact').textContent = [$('f-email').value, $('f-phone').value, $('f-loc').value].filter(Boolean).join('  •  ');
    $('r-summary').textContent = $('f-summary').value;
    $('r-skills').innerHTML = $('f-skills').value.split(',').map(s => s.trim()).filter(Boolean)
      .map(s => '<span>' + esc(s) + '</span>').join('');
    $('r-exp').innerHTML = lines('f-exp').map(s => '<li>' + esc(s) + '</li>').join('');
    $('r-edu').innerHTML = lines('f-edu').map(s => '<li>' + esc(s) + '</li>').join('');
  }
  render();
</script>
</body>
</html>
